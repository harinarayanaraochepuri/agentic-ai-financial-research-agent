[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ara1-financial-research-agent"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["langchain>=0.3.20", "langchain-openai>=0.3.7", "langgraph>=0.2.60", "langchain-community>=0.3.18", "langchain-chroma>=0.2.2", "chromadb>=0.6.3", "python-dotenv>=1.0.1", "requests>=2.32.3", "yfinance>=0.2.54", "duckduckgo-search>=7.5.0"]

[tool.setuptools.packages.find]
include = ["agent*", "tools*", "memory*", "synthesis*", "evaluation*"]
